name: Lint, Run Scripts, and Publish Release on Tag

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"  # Only trigger on tags that start with "v"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run Python scripts in CAD folder
        run: |
          find cad -name "*.py" | while read file; do
            echo "Running $file"
            uv run python "$file"
          done

      - name: Stage build products for upload
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"

          # Each CAD script exports into its own build/<script>/ folder, so
          # collect the files recursively and flatten the folder name into
          # the asset name: several scripts emit a QFH_Antenna_436_MHz.stl,
          # and release asset names have to be unique.  The tag goes just
          # before the extension.
          rm -rf release-assets
          mkdir -p release-assets
          count=0
          while IFS= read -r -d '' file; do
            rel="${file#build/}"
            flat="${rel//\//-}"
            case "$flat" in
              *.*) asset="${flat%.*}-$tag.${flat##*.}" ;;
              *)   asset="$flat-$tag" ;;
            esac
            echo "Staging $file as $asset"
            cp "$file" "release-assets/$asset"
            count=$((count + 1))
          done < <(find build -type f -print0)

          if [ "$count" -eq 0 ]; then
            echo "::error::No build products found under build/"
            exit 1
          fi
          echo "Staged $count build products."

      # Uploaded as a workflow artifact before the release is created, so the
      # build products are retrievable even if a later step fails.
      - name: Upload build products to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cad-build-${{ github.ref_name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

      # Created only once the build products exist and are safely stored, so
      # a failure earlier in the job cannot leave an empty release behind.
      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}  # Use the tag name from the push event
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Install GitHub CLI
        run: sudo apt-get install gh

      - name: Upload build products to release
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          echo "Uploading build products to release for $tag"

          # One call for the lot, and --clobber so re-running the workflow
          # for an existing tag replaces the assets instead of failing.
          gh release upload "$tag" release-assets/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
